<header class="site-header">
  <a class="brand" href="/" aria-label="{{site.title}} home"><span class="logo">presswork<span class="dot">.</span></span></a>

  <div class="end">
  <button class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="true" hidden><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
  <nav class="nav" aria-label="Main">
    <button class="toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <ul class="list" id="site-menu" role="list">
{{nav:item}}
    </ul>
  </nav>
  </div>
</header>

<script>
  (function () {
    var header = document.querySelector("header.site-header");
    var button = header && header.querySelector(".toggle");
    if (!header || !button) return;

    header.setAttribute("data-menu", "");

    function setOpen(open) {
      header.toggleAttribute("data-open", open);
      button.setAttribute("aria-expanded", String(open));
    }

    button.addEventListener("click", function () {
      setOpen(!header.hasAttribute("data-open"));
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && header.hasAttribute("data-open")) {
        var inside = header.contains(document.activeElement);
        setOpen(false);
        if (inside) button.focus();
      }
    });

    document.addEventListener("click", function (event) {
      if (!header.contains(event.target)) setOpen(false);
    });

    header.addEventListener("focusout", function (event) {
      if (event.relatedTarget && !header.contains(event.relatedTarget)) {
        setOpen(false);
      }
    });

    matchMedia("(max-width: 40rem)").addEventListener("change", function (e) {
      if (!e.matches) setOpen(false);
    });
  })();
</script>

<script>
  (function () {
    var root = document.documentElement;
    var button = document.querySelector(".theme-toggle");
    if (!button) return;
    var system = matchMedia("(prefers-color-scheme: light)");
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    var colors = ["{{site.themeColor}}", "{{site.themeColorLight}}"];

    function current() {
      return root.getAttribute("data-theme") || (system.matches ? "light" : "dark");
    }

    function paint() {
      var theme = current();
      var chosen = root.hasAttribute("data-theme");
      button.setAttribute("aria-pressed", String(theme === "dark"));
      metas.forEach(function (meta, i) {
        meta.content = chosen ? colors[theme === "dark" ? 0 : 1] : colors[i];
      });
    }

    function load() {
      var stored = null;
      try {
        stored = localStorage.getItem("theme");
      } catch (e) {}
      if (stored === "light" || stored === "dark") root.setAttribute("data-theme", stored);
      else root.removeAttribute("data-theme");
      paint();
    }

    button.hidden = false;
    paint();

    button.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try {
        localStorage.setItem("theme", next);
      } catch (e) {}
      paint();
    });

    system.addEventListener("change", paint);
    addEventListener("storage", function (event) {
      if (event.key === "theme" || event.key === null) load();
    });
    addEventListener("pageshow", function (event) {
      if (event.persisted) load();
    });
  })();
</script>
