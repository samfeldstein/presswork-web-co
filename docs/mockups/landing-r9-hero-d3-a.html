<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presswork: websites for owner-run local businesses</title>
<!--
  Round 9, hero only, designer 3, pitch A: "Pine and bone."
  A dark pine field. The headline in Oswald, each line set to the full width of the page, so the words are the whole picture.
  Noto Serif for the intro. One ochre square button.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..600&family=Noto+Serif:wght@400;500&display=swap">
<style>
:root {
  --pine: #18211c;
  --bone: #ebe4d6;
  --moss: #9aa392;
  --ochre: #d4a14e;
  --line: #3a453d;
  --gutter: 56px;
  --display: "Oswald", "Arial Narrow", sans-serif;
  --text: "Noto Serif", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--pine);
  color: var(--bone);
  font-family: var(--text);
  font-kerning: normal;
  font-size: 17px;
  line-height: 1.55;
}
a { color: inherit; text-underline-offset: .28em; text-decoration-thickness: 1px; }
:focus-visible { outline: 3px solid var(--ochre); outline-offset: 4px; }
ul { list-style: none; margin: 0; padding: 0; }
.wrap { padding-inline: var(--gutter); }

.page { min-height: 100svh; display: flex; flex-direction: column; }

.masthead {
  display: flex; align-items: baseline; justify-content: space-between;
  padding-block: 24px 0;
  font-family: var(--display);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.wordmark { font-weight: 600; font-size: 19px; text-decoration: none; letter-spacing: .14em; }
.masthead nav ul { display: flex; gap: 36px; }
.masthead nav a { font-size: 14px; font-weight: 400; text-decoration: none; color: var(--moss); }
.masthead nav a:hover { color: var(--bone); }

.hero {
  flex: 1;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 22px 40px;
  gap: 30px;
}
.hero h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 500;
  text-transform: uppercase;
  line-height: .83;
  letter-spacing: -0.005em;
}
.hero h1 .ln { display: block; white-space: nowrap; width: max-content; }
.hero h1 .ln + .ln { margin-top: .04em; }

.foot {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 var(--gutter);
  align-items: end;
  border-top: 1px solid var(--line);
  padding-top: 26px;
}
.foot p {
  margin: 0;
  max-width: 34ch;
  font-size: 21px;
  line-height: 1.5;
  color: var(--bone);
}
.actions {
  display: flex; align-items: center; justify-content: flex-end; gap: 32px;
  font-family: var(--display);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.button {
  display: inline-block;
  padding: 19px 30px 18px;
  background: var(--ochre);
  color: var(--pine);
  font-weight: 600; font-size: 17px; line-height: 1;
  text-decoration: none;
  border: 1.5px solid var(--ochre);
}
.button:hover { background: transparent; color: var(--ochre); }
.textlink { font-size: 16px; font-weight: 400; color: var(--bone); }
.textlink:hover { color: var(--ochre); }
</style>
</head>
<body>
<div class="page">

<header class="wrap masthead">
  <a class="wordmark" href="#top">Presswork</a>
  <nav aria-label="Sections">
    <ul>
      <li><a href="#services">Services</a></li>
      <li><a href="#prices">Prices</a></li>
      <li><a href="#start">How it starts</a></li>
      <li><a href="#work">Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="top" class="wrap hero" aria-labelledby="hero-title">
  <h1 id="hero-title"><span class="ln">Websites for</span> <span class="ln">owner-run</span> <span class="ln">local businesses.</span></h1>
  <div class="foot">
    <p>I’m Sam. I build and look after websites for small businesses in Colorado, and help people find them on Google and in AI search.</p>
    <div class="actions">
      <a class="textlink" href="#prices">See example prices</a>
      <a class="button" href="#contact">Ask for a free website check</a>
    </div>
  </div>
</main>

</div>
<script>
(() => {
  const h1 = document.querySelector('.hero h1');
  const lines = [...h1.querySelectorAll('.ln')];
  function fit() {
    const w = h1.clientWidth;
    lines.forEach(l => {
      l.style.fontSize = '100px';
      l.style.fontSize = (100 * w / l.getBoundingClientRect().width) + 'px';
    });
  }
  document.fonts.ready.then(fit);
  addEventListener('resize', fit);
})();
</script>
</body>
</html>
