<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presswork: websites for owner-run local businesses</title>
<!--
  Round 7, hero only, designer 1, pitch B: "Screen-filling grotesk."
  Geist (tight, semibold) for the headline, Geist Mono for the masthead, the Sam line, and the buttons.
  The hero fills the first screen: the Sam line and buttons sit high on the right, the headline sinks to the bottom edge.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
:root {
  --paper: #f2f1ed;
  --ink: #262523;
  --grey: #5d5b57;
  --hair: #c8c6c0;
  --gutter: clamp(16px, 3.6vw, 56px);
  --display: "Geist", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--display);
  font-size: 1rem;
  line-height: 1.55;
  font-kerning: normal;
}
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .26em; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
p { margin: 0; }
h1 { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
.wrap { padding-inline: var(--gutter); }

.masthead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  padding-block: 20px 18px; border-bottom: 1px solid var(--ink);
}
.wordmark { font-family: var(--display); font-weight: 650; font-size: 1.375rem; line-height: 1; letter-spacing: -0.035em; text-decoration: none; }
.masthead nav ul { display: flex; gap: clamp(16px, 2.4vw, 36px); }
.masthead nav a { font-family: var(--mono); font-size: .875rem; letter-spacing: -0.01em; text-decoration: none; }
.masthead nav a:hover { text-decoration: underline; }
@media (max-width: 860px) { .masthead nav li:not(:last-child) { display: none; } }

.hero {
  min-height: calc(100svh - 62px);
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-template-rows: auto 1fr auto;
  column-gap: var(--gutter);
  padding-block: clamp(28px, 4vw, 56px) clamp(28px, 3.4vw, 52px);
}
.hero-foot { grid-column: 7 / -1; grid-row: 1; display: grid; gap: 28px; align-content: start; }
.hero-foot p { font-family: var(--mono); font-size: clamp(1rem, .92rem + .35vw, 1.1875rem); line-height: 1.55; letter-spacing: -0.015em; max-width: 40ch; text-wrap: pretty; }
.hero h1 {
  grid-column: 1 / -1; grid-row: 3;
  margin-top: clamp(64px, 10vw, 160px);
  font-weight: 600;
  font-size: clamp(3rem, 9.6vw, 11.25rem);
  line-height: .9;
  letter-spacing: -0.055em;
  max-width: 7em;
  text-wrap: balance;
}
.actions { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.button {
  display: inline-block; font-family: var(--mono); font-weight: 500; font-size: .9375rem; letter-spacing: -0.01em; line-height: 1;
  padding: 16px 22px; background: var(--ink); color: var(--paper); text-decoration: none;
  border: 1px solid var(--ink);
}
.button:hover { background: transparent; color: var(--ink); }
.textlink { font-family: var(--mono); font-size: .9375rem; letter-spacing: -0.01em; }
@media (max-width: 860px) {
  .hero-foot { grid-column: 1 / -1; }
  .hero h1 { font-size: clamp(3rem, 12.2vw, 6rem); letter-spacing: -0.045em; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="wrap masthead">
  <a class="wordmark" href="#top">Presswork</a>
  <nav aria-label="Sections">
    <ul>
      <li><a href="#services">Services</a></li>
      <li><a href="#prices">Prices</a></li>
      <li><a href="#start">How it starts</a></li>
      <li><a href="#work">Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="top">
  <section class="wrap hero" aria-labelledby="hero-title">
    <h1 id="hero-title">Websites for owner&#8209;run local businesses.</h1>
    <div class="hero-foot">
      <p>I’m Sam. I build and look after websites for small businesses in Colorado, and help people find them on Google.</p>
      <div class="actions">
        <a class="button" href="#contact">Ask for a free check</a>
        <a class="textlink" href="#prices">See example prices</a>
      </div>
    </div>
  </section>
</main>

</body>
</html>
