<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presswork: websites for owner-run local businesses</title>
<!--
  Round 7, hero only, designer 2, pitch A: "Low statement."
  Serif display over a sans text face, the reverse of the usual pairing.
  Headline in Instrument Serif (one weight, set large and light), text and UI in Geist.
  The hero fills the first screen; the intro and buttons sit up top in a narrow column,
  the headline drops to the bottom edge and runs the full width.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Instrument+Serif&display=swap">
<style>
:root {
  --paper: #f2f1ed;
  --ink: #262523;
  --grey: #5d5b57;
  --hair: #c8c6c0;
  --gutter: clamp(16px, 4.4vw, 72px);
  --display: "Instrument Serif", Georgia, serif;
  --text: "Geist", "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.0625rem;
  line-height: 1.55;
  font-kerning: normal;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .24em; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
p { margin: 0; }
h1 { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
.wrap { padding-inline: var(--gutter); }

.masthead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  padding-block: 22px; border-bottom: 1px solid var(--ink);
}
.wordmark { font-family: var(--display); font-size: 2rem; line-height: 1; text-decoration: none; letter-spacing: -0.005em; }
.masthead nav ul { display: flex; gap: clamp(16px, 2.2vw, 36px); }
.masthead nav a { font-size: .9375rem; font-weight: 500; text-decoration: none; }
.masthead nav a:hover { text-decoration: underline; }
@media (max-width: 860px) { .masthead nav li:not(:last-child) { display: none; } }

.hero {
  min-height: calc(100svh - 77px);
  display: grid; grid-template-rows: auto 1fr auto;
  padding-block: clamp(28px, 4vw, 56px) clamp(24px, 3vw, 48px);
}
.intro {
  grid-row: 1;
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 28px;
}
.intro p {
  grid-column: 7 / span 5;
  font-size: clamp(1.1875rem, 1rem + .6vw, 1.5rem); line-height: 1.4; letter-spacing: -0.01em;
  max-width: 30ch; text-wrap: pretty;
}
.actions { grid-column: 7 / span 6; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }
.button {
  display: inline-block; font-weight: 550; font-size: 1rem; line-height: 1;
  padding: 16px 24px; background: var(--ink); color: var(--paper); text-decoration: none;
  border: 1.5px solid var(--ink); border-radius: 999px;
}
.button:hover { background: transparent; color: var(--ink); }
.textlink { font-weight: 550; font-size: 1rem; }

.hero h1 {
  grid-row: 3;
  margin-top: clamp(40px, 5vw, 72px);
  font-family: var(--display); font-weight: 400;
  font-size: clamp(3.25rem, min(1rem + 14.6vw, 20.5svh), 15.5rem);
  line-height: .88; letter-spacing: -0.02em;
}
.nb { white-space: nowrap; }
.hy { margin-inline: -.03em; }

@media (max-width: 860px) {
  .hero { display: block; min-height: 0; padding-block: clamp(40px, 8vw, 72px) clamp(64px, 12vw, 104px); }
  .hero h1 { margin-top: 0; text-wrap: balance; }
  .hero h1 br { display: none; }
  .intro { margin-top: clamp(32px, 6vw, 48px); }
  .intro p, .actions { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: clamp(3.25rem, 15.6vw, 4.5rem); letter-spacing: -0.016em; line-height: .92; }
}
</style>
</head>
<body>

<header class="wrap masthead">
  <a class="wordmark" href="#top">Presswork</a>
  <nav aria-label="Sections">
    <ul>
      <li><a href="#services">Services</a></li>
      <li><a href="#prices">Prices</a></li>
      <li><a href="#start">How it starts</a></li>
      <li><a href="#work">Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="top">
  <section class="wrap hero" aria-labelledby="hero-title">
    <h1 id="hero-title">Websites for<br> <span class="nb">owner<span class="hy">-</span>run</span> local<br> businesses.</h1>
    <div class="intro">
      <p>I’m Sam. I build and look after websites for small businesses in Colorado, and help people find them on Google.</p>
      <div class="actions">
        <a class="button" href="#contact">Ask for a free check</a>
        <a class="textlink" href="#prices">See example prices</a>
      </div>
    </div>
  </section>
</main>

</body>
</html>
