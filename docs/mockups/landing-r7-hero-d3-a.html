<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presswork: websites for owner-run local businesses</title>
<!--
  Round 7, hero only, designer 3, pitch A: "Quiet serif."
  Instrument Serif for the headline and wordmark, Geist for everything else.
  Centered on one axis; the headline is the only large thing on the page.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root {
  --paper: #f2f1ed;
  --ink: #262523;
  --grey: #5d5b57;
  --hair: #c8c6c0;
  --gutter: clamp(16px, 4.4vw, 72px);
  --display: "Instrument Serif", "Times New Roman", serif;
  --text: "Geist", "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.0625rem;
  line-height: 1.55;
  font-kerning: normal;
  font-feature-settings: "kern" 1;
}
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .24em; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
ul { list-style: none; margin: 0; padding: 0; }
.wrap { padding-inline: var(--gutter); }
.nobr { white-space: nowrap; }

.masthead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  padding-block: 22px;
  border-bottom: 1px solid var(--hair);
}
.wordmark { font-family: var(--display); font-size: 1.75rem; line-height: 1; text-decoration: none; letter-spacing: .005em; }
.masthead nav ul { display: flex; gap: clamp(16px, 2.2vw, 34px); }
.masthead nav a { font-size: .9375rem; font-weight: 500; text-decoration: none; letter-spacing: .005em; }
.masthead nav a:hover { text-decoration: underline; }
@media (max-width: 860px) { .masthead nav li:not(:last-child) { display: none; } }

.hero {
  text-align: center;
  padding-block: clamp(64px, 11vw, 176px) clamp(80px, 12vw, 192px);
}
.hero h1 {
  margin: 0 auto;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(3.25rem, 1.4rem + 8.4vw, 10.5rem);
  line-height: .96;
  letter-spacing: -0.018em;
  max-width: 11ch;
  text-wrap: balance;
}
@media (min-width: 900px) {
  .hero { padding-block: clamp(72px, 8vw, 128px) clamp(96px, 10vw, 160px); }
  .hero h1 { max-width: 15ch; font-size: clamp(5rem, 1rem + 7.4vw, 9.5rem); }
}
.hero h1 em {font-style: italic; letter-spacing: -0.01em; }
.hero p {
  margin: clamp(28px, 3.4vw, 48px) auto 0;
  max-width: 34ch;
  font-size: clamp(1.125rem, 1rem + .45vw, 1.375rem);
  line-height: 1.5;
  color: var(--grey);
  text-wrap: pretty;
}
.actions {
  margin-top: clamp(32px, 3.6vw, 52px);
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px 30px;
}
.button {
  display: inline-block; font-weight: 500; font-size: 1.0625rem; line-height: 1;
  padding: 17px 28px; border-radius: 999px;
  background: var(--ink); color: var(--paper); text-decoration: none;
  border: 1.5px solid var(--ink);
}
.button:hover { background: transparent; color: var(--ink); }
.textlink { font-weight: 500; font-size: 1.0625rem; }
.textlink:hover { text-decoration-thickness: 2px; }
</style>
</head>
<body>

<header class="wrap masthead">
  <a class="wordmark" href="#top">Presswork</a>
  <nav aria-label="Sections">
    <ul>
      <li><a href="#services">Services</a></li>
      <li><a href="#prices">Prices</a></li>
      <li><a href="#start">How it starts</a></li>
      <li><a href="#work">Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="top">
  <section class="wrap hero" aria-labelledby="hero-title">
    <h1 id="hero-title">Websites for <span class="nobr">owner-run</span> <em>local</em> businesses.</h1>
    <p>I’m Sam. I build and look after websites for small businesses in Colorado, and help people find them on Google.</p>
    <div class="actions">
      <a class="button" href="#contact">Ask for a free check</a>
      <a class="textlink" href="#prices">See example prices</a>
    </div>
  </section>
</main>

</body>
</html>
