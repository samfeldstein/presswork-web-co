<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presswork: websites for owner-run local businesses</title>
<!--
  Round 8, hero only, designer 2, pitch A: "Wall of type."
  Oswald headline set as large as the width allows, starting right under the masthead.
  The intro and buttons sit in the open space to the right of the short last line, so the empty space is filled by the next thing to read.
  Oswald for the headline, wordmark, nav, and buttons; Noto Serif for the intro.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Noto+Serif:wght@400;500&display=swap">
<style>
:root {
  --paper: #f2f1ed;
  --ink: #262523;
  --grey: #5d5b57;
  --gutter: 64px;
  --display: "Oswald", "Arial Narrow", sans-serif;
  --text: "Noto Serif", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.0625rem;
  line-height: 1.55;
  font-kerning: normal;
}
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .24em; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
ul { list-style: none; margin: 0; padding: 0; }
.wrap { padding-inline: var(--gutter); }

.page { display: flex; flex-direction: column; }

.masthead {
  display: flex; align-items: baseline; justify-content: space-between;
  padding-block: 24px 0;
  font-family: var(--display);
  text-transform: uppercase;
}
.wordmark { font-weight: 600; font-size: 1.25rem; line-height: 1; letter-spacing: .04em; text-decoration: none; }
.masthead nav ul { display: flex; gap: 32px; }
.masthead nav a { font-size: .9375rem; font-weight: 500; letter-spacing: .06em; text-decoration: none; }
.masthead nav a:hover { text-decoration: underline; }

.hero {
  flex: 1;
  position: relative;
  display: block;
  padding-block: 64px 136px;
  border-bottom: 2px solid var(--ink);
  margin-inline: var(--gutter);
  padding-inline: 0;
}
.hero h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 500;
  font-size: 12rem;
  line-height: .86;
  letter-spacing: -0.012em;
  text-transform: none;
}
.hero h1 .line { display: block; white-space: nowrap; }

.aside {
  position: absolute;
  right: 0;
  top: 452px;
  width: 432px;
  border-top: 2px solid var(--ink);
  padding-top: 20px;
}
.aside p {
  margin: 0 0 26px;
  font-size: 1.25rem;
  line-height: 1.5;
  text-wrap: pretty;
}
.actions { display: flex; align-items: center; gap: 28px; font-family: var(--display); }
.button {
  display: inline-block; font-weight: 500; font-size: 1.0625rem; line-height: 1;
  letter-spacing: .05em; text-transform: uppercase;
  padding: 17px 24px; background: var(--ink); color: var(--paper); text-decoration: none;
  border: 2px solid var(--ink);
}
.button:hover { background: transparent; color: var(--ink); }
.textlink { font-weight: 500; font-size: 1.0625rem; letter-spacing: .05em; text-transform: uppercase; }
.textlink:hover { text-decoration-thickness: 2px; }
</style>
</head>
<body>
<div class="page">

<header class="wrap masthead">
  <a class="wordmark" href="#top">Presswork</a>
  <nav aria-label="Sections">
    <ul>
      <li><a href="#services">Services</a></li>
      <li><a href="#prices">Prices</a></li>
      <li><a href="#start">How it starts</a></li>
      <li><a href="#work">Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="top" class="wrap hero" aria-labelledby="hero-title">
  <h1 id="hero-title"><span class="line">Websites for</span> <span class="line">owner-run local</span> <span class="line">businesses.</span></h1>
  <div class="aside">
    <p>I’m Sam. I build and look after websites for small businesses in Colorado, and help people find them on Google.</p>
    <div class="actions">
      <a class="button" href="#contact">Ask for a free check</a>
      <a class="textlink" href="#prices">See example prices</a>
    </div>
  </div>
</main>

</div>
</body>
</html>
