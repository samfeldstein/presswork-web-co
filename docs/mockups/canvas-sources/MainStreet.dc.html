<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Presswork homepage, Main Street direction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=Rubik:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EAF2F3}
a{color:#22303A}a:hover{color:#B04A28}
.pw-shop:focus-visible{outline:3px solid #22303A;outline-offset:6px;border-radius:6px}
@keyframes pw-rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes pw-awn{from{transform:scaleY(0)}to{transform:none}}
@keyframes pw-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pw-ride{from{left:-90px}to{left:100%}}
@keyframes pw-drift{from{transform:translateX(-10vw)}to{transform:translateX(110vw)}}
@keyframes pw-fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pw-rise{animation:pw-rise .8s cubic-bezier(.2,.9,.3,1.2) both}
.pw-awn{transform-origin:top;animation:pw-awn .6s cubic-bezier(.3,1.5,.5,1) both}
.pw-bob{animation:pw-bob 1.2s ease-in-out infinite}
.pw-ride{animation:pw-ride 16s linear 2s infinite}
.pw-drift{animation:pw-drift 60s linear infinite}
.pw-in{animation:pw-fade .9s cubic-bezier(.2,.7,.2,1) both}
.pw-in2{animation-delay:.15s}
@media (prefers-reduced-motion: reduce){.pw-rise,.pw-awn,.pw-bob,.pw-ride,.pw-drift,.pw-in{animation:none}.pw-ride{left:12%}}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #EAF2F3; color: #22303A; font-family: 'Rubik', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 28px; padding: 8px clamp(16px, 3vw, 40px)">
<span style="font-family: 'DM Serif Display', serif; font-size: 26px; padding: 8px 0">Presswork</span>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 0 28px; font-size: 17px; font-weight: 500">
<a href="#plans" style="text-decoration: none; padding: 12px 0">Plans</a>
<a href="#work" style="text-decoration: none; padding: 12px 0">Work</a>
<a href="#about" style="text-decoration: none; padding: 12px 0">About</a>
<a href="#contact" style="text-decoration: none; padding: 12px 0">Contact</a>
</nav>
</header>

<section style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 48px; padding: clamp(8px, 2vw, 24px) clamp(16px, 3vw, 40px) 0">
<div class="pw-in" style="flex: 1 1 520px; max-width: 820px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: clamp(44px, 5.4vw, 86px); line-height: 1.02; letter-spacing: -0.015em">Your <sc-if value="{{hasPick}}" hint-placeholder-val="{{ false }}"><em style="color: #B04A28; margin-right: 0.22em">{{word}}</em></sc-if>website, fully managed.</h1>
<p aria-live="polite" style="margin: 0; max-width: 46ch; min-height: 3em; font-size: clamp(18px, 1.5vw, 21px); line-height: 1.5">{{lead}}</p>
</div>
<div id="plans" class="pw-in pw-in2" style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-bottom: 6px">
<span style="font-size: 18px"><strong>$0 down</strong>, then $150 a month</span>
<a href="#contact" style="display: inline-flex; align-items: center; min-height: 54px; padding: 0 28px; background: #22303A; color: #FFFDF8; border-radius: 12px; font-size: 18px; font-weight: 600; text-decoration: none">Book a free site audit</a>
</div>
</section>

<section aria-label="Pick the shop most like yours" style="position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 380px; margin-top: 12px">

<div aria-hidden="true" class="pw-drift" style="position: absolute; top: 18px; left: 0; width: 150px; height: 50px">
<span style="position: absolute; left: 0; bottom: 0; width: 150px; height: 26px; border-radius: 20px; background: #FFFFFF"></span>
<span style="position: absolute; left: 28px; bottom: 10px; width: 56px; height: 40px; border-radius: 50%; background: #FFFFFF"></span>
<span style="position: absolute; left: 70px; bottom: 6px; width: 46px; height: 34px; border-radius: 50%; background: #FFFFFF"></span>
</div>

<div style="position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 0 clamp(16px, 3vw, 40px) 4px">
<span style="font-size: 17px; font-weight: 600">Which one is yours? Tap your shop.</span>
<sc-if value="{{hasPick}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{reset}}" style="min-height: 44px; padding: 0 16px; background: transparent; border: 1.5px solid #22303A; border-radius: 999px; font-family: 'Rubik', sans-serif; font-size: 15px; font-weight: 500; color: #22303A; cursor: pointer">Something else</button>
</sc-if>
</div>

<div style="position: relative; display: flex; align-items: flex-end; justify-content: center; gap: clamp(10px, 1.6vw, 22px); padding: 0 clamp(16px, 3vw, 40px); overflow-x: auto">
<sc-for list="{{shops}}" as="s" hint-placeholder-count="5">
<div class="pw-rise" style="animation-delay: {{s.delay}}; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center">
<div style="height: 34px; display: flex; align-items: flex-end">
<sc-if value="{{s.picked}}" hint-placeholder-val="{{ false }}">
<svg class="pw-bob" aria-hidden="true" width="22" height="28" viewBox="0 0 22 28"><path d="M11 27 L2.5 14 A10 10 0 1 1 19.5 14 Z" fill="#B04A28"></path><circle cx="11" cy="10" r="4" fill="#FFFDF8"></circle></svg>
</sc-if>
</div>
<button type="button" class="pw-shop" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="display: flex; flex-direction: column; align-items: stretch; width: clamp(128px, 13vw, 190px); padding: 0; border: 0; background: transparent; cursor: pointer; font-family: 'Rubik', sans-serif; color: #22303A; transform: {{s.lift}}; transition: transform 0.35s cubic-bezier(.3,1.6,.5,1)">
<span style="margin: 0 12px; min-height: 36px; display: flex; align-items: center; justify-content: center; padding: 4px 6px; background: #FFFDF8; border: 2px solid #22303A; border-bottom: 0; border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; line-height: 1.15; text-transform: uppercase; text-align: center">{{s.name}}</span>
<span style="display: flex; flex-direction: column; height: {{s.h}}; background: {{s.body}}; border: 2px solid #22303A; border-bottom: 0; border-radius: 4px 4px 0 0; overflow: hidden">
<span style="height: 10px; background: {{s.trim}}; border-bottom: 2px solid #22303A"></span>
<span style="display: flex; justify-content: space-around; padding: 14px 14px 0">
<span style="width: 30%; height: 36px; background: {{s.upper}}; border: 2px solid #22303A; border-radius: 14px 14px 2px 2px; transition: background 0.4s"></span>
<span style="width: 30%; height: 36px; background: {{s.upper}}; border: 2px solid #22303A; border-radius: 14px 14px 2px 2px; transition: background 0.4s"></span>
</span>
<span style="flex-grow: 1"></span>
<span class="pw-awn" style="animation-delay: {{s.awnDelay}}; height: 24px; background: repeating-linear-gradient(90deg, {{s.awn}} 0 14px, #FFFDF8 14px 28px); border-top: 2px solid #22303A; border-bottom: 2px solid #22303A"></span>
<span style="display: flex; gap: 8px; padding: 10px 10px 0; height: 96px">
<span style="flex-grow: 1; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; background: {{s.glass}}; border: 2px solid #22303A; border-radius: 3px; transition: background 0.4s">
<sc-if value="{{s.isBread}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#22303A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15c0-4.5 3.6-8 8-8s8 3.5 8 8v3H4z"></path><path d="M9 10.5l1.5 2.5M12.5 9.5l1.5 2.5"></path></svg></sc-if>
<sc-if value="{{s.isPlus}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#22303A" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v9M7.5 12h9"></path></svg></sc-if>
<sc-if value="{{s.isNote}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#22303A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg></sc-if>
<sc-if value="{{s.isHammer}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#22303A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-3 3-6-6z"></path><path d="M11 10l-7 7 3 3 7-7"></path></svg></sc-if>
<sc-if value="{{s.isHeart}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#22303A" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"></path></svg></sc-if>
</span>
<span style="position: relative; width: 30%; background: {{s.door}}; border: 2px solid #22303A; border-bottom: 0; border-radius: 4px 4px 0 0"><span style="position: absolute; right: 5px; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: #FFFDF8"></span></span>
</span>
</span>
</button>
</div>
</sc-for>

<div aria-hidden="true" class="pw-rise" style="animation-delay: 0.9s; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; margin-left: 8px">
<span style="padding: 5px 12px; background: #2F6B4F; color: #FFFFFF; border: 2px solid #FFFFFF; outline: 2px solid #2F6B4F; border-radius: 4px; font-size: 13px; font-weight: 700; white-space: nowrap; transform: rotate(-3deg)">Look Good Ave</span>
<span style="margin-top: 6px; padding: 5px 12px; background: #2F6B4F; color: #FFFFFF; border: 2px solid #FFFFFF; outline: 2px solid #2F6B4F; border-radius: 4px; font-size: 13px; font-weight: 700; white-space: nowrap; transform: rotate(4deg)">Get Found St</span>
<span style="margin-top: 6px; padding: 5px 12px; background: #2F6B4F; color: #FFFFFF; border: 2px solid #FFFFFF; outline: 2px solid #2F6B4F; border-radius: 4px; font-size: 13px; font-weight: 700; white-space: nowrap; transform: rotate(-2deg)">Get to Work Blvd</span>
<span style="width: 7px; height: 150px; background: #5B6770; border-radius: 3px 3px 0 0"></span>
</div>
</div>

<div aria-hidden="true" style="height: 18px; background: #E6DFD0; border-top: 2px solid #22303A"></div>
<div aria-hidden="true" style="position: relative; height: 58px; background: #5E6A70; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; top: 27px; height: 4px; background: repeating-linear-gradient(90deg, #FFFDF8 0 28px, transparent 28px 56px)"></div>
<svg class="pw-ride" width="70" height="46" viewBox="0 0 70 46" style="position: absolute; bottom: 4px; left: -90px" fill="none" stroke="#FFFDF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<circle cx="14" cy="34" r="9"></circle><circle cx="54" cy="34" r="9"></circle>
<path d="M14 34 L28 18 L46 18 L54 34 M28 18 L34 34 L46 18"></path>
<path d="M34 34 L32 12"></path><circle cx="31" cy="6" r="4" fill="#F4C3AE" stroke="none"></circle>
<rect x="44" y="10" width="14" height="9" rx="2" fill="#F6DC93" stroke="none"></rect>
</svg>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: null };
this.reset = () => this.setState({ picked: null });
this.data = [
{ id: 'bakery', name: 'Bakery', word: 'bakery’s', body: '#F4C3AE', trim: '#E39B7B', awn: '#D2694A', door: '#8A4B3A', h: '232px', icon: 'bread', lead: 'Today’s specials, your hours and holiday closures, updated for you whenever they change.' },
{ id: 'clinic', name: 'Clinic', word: 'clinic’s', body: '#BFE0D4', trim: '#8CC4B0', awn: '#3F8C77', door: '#2F6B5C', h: '272px', icon: 'plus', lead: 'A calm, clear site where patients find your services, your hours and how to book.' },
{ id: 'studio', name: 'Dance studio', word: 'studio’s', body: '#E4CDEA', trim: '#C7A3D3', awn: '#8C5AA0', door: '#5E3F6E', h: '252px', icon: 'note', lead: 'Class schedules, recitals and sign-ups, kept current every season.' },
{ id: 'crew', name: 'Contractor', word: 'crew’s', body: '#F6DC93', trim: '#E6BE55', awn: '#C98A12', door: '#6E5222', h: '214px', icon: 'hammer', lead: 'Show off your best jobs, get found in local search and turn visitors into phone calls.' },
{ id: 'nonprofit', name: 'Community center', word: 'nonprofit’s', body: '#C3CFEE', trim: '#98A9DE', awn: '#4E64B0', door: '#34437A', h: '262px', icon: 'heart', lead: 'Events, volunteer sign-ups and donations, easy for everyone who visits.' }
];
}
renderVals() {
const picked = this.state.picked;
const current = this.data.find((d) => d.id === picked);
const shops = this.data.map((d, i) => {
const on = d.id === picked;
return {
name: d.name, body: d.body, trim: d.trim, awn: d.awn, door: d.door, h: d.h,
picked: on, pressed: on ? 'true' : 'false',
lift: on ? 'translateY(-12px)' : 'none',
glass: on ? '#FFE39A' : '#DCEAF0',
upper: on ? '#FFE9AE' : '#FFFDF8',
delay: (0.2 + i * 0.12) + 's',
awnDelay: (0.95 + i * 0.12) + 's',
isBread: d.icon === 'bread', isPlus: d.icon === 'plus', isNote: d.icon === 'note', isHammer: d.icon === 'hammer', isHeart: d.icon === 'heart',
pick: () => this.setState({ picked: on ? null : d.id })
};
});
return {
shops: shops,
hasPick: !!current,
word: current ? current.word : '',
lead: current ? current.lead : 'Built, hosted and looked after by one person who answers, so you can get back to running your business.',
reset: this.reset
};
}
}
</script>
</body>
</html>
